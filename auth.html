<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title_auth">Кіру — Білім</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
</head>
<body>
  <div class="auth-wrap">
    <a class="auth-home" href="index.html" data-i18n="auth_home">← Басты бетке</a>
    <div class="auth-card">
      <div class="auth-logo">🎓</div>
      <h1 id="auth-title">Кіру</h1>
      <p class="muted" id="auth-sub">Мұғалімдер мен оқушыларға арналған кеңістік</p>

      <!-- Google -->
      <button class="btn google-btn" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        <span data-i18n="auth_google">Google арқылы кіру</span>
      </button>

      <div class="auth-divider"><span data-i18n="auth_or">немесе email арқылы</span></div>

      <!-- Табдар -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login" data-i18n="auth_title">Кіру</button>
        <button class="auth-tab" data-tab="reg" data-i18n="auth_title_reg">Тіркелу</button>
      </div>

      <!-- Кіру -->
      <form id="login-form">
        <label><span data-i18n="li_email">Эл-пошта</span><input type="email" id="li-email" required placeholder="email@me.kz" /></label>
        <label><span data-i18n="li_pass">Пароль</span>
          <div class="pass-wrap">
            <input type="password" id="li-pass" required placeholder="••••••" />
            <button type="button" class="pass-toggle" data-target="li-pass" aria-label="Парольді көрсету/жасыру" data-i18n-title="pass_toggle" title="Көрсету / жасыру">👁️</button>
          </div>
        </label>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_title">Кіру</button>
        <div class="forgot-row">
          <button type="button" class="forgot-link" id="forgot-toggle" data-i18n="forgot">Пароль ұмытылды ма?</button>
        </div>
      </form>

      <!-- Пароль қалпына келтіру -->
      <form id="reset-form" style="display:none">
        <p class="reset-note" data-i18n="reset_note">Email-іңізді жазыңыз — жаңа пароль орнату сілтемесін почтаңызға жібереміз</p>
        <label><span data-i18n="li_email">Эл-пошта</span><input type="email" id="rs-email" required placeholder="email@me.kz" /></label>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="reset_send">Сілтеме жіберу</button>
        <div class="forgot-row">
          <button type="button" class="forgot-link" id="reset-back" data-i18n="reset_back">← Кіруге оралу</button>
        </div>
      </form>

      <!-- Тіркелу -->
      <form id="reg-form" style="display:none">
        <label><span data-i18n="rg_name">Аты-жөніңіз</span><input type="text" id="rg-name" required data-i18n-ph="rg_name_ph" placeholder="Аты-жөні" /></label>
        <label><span data-i18n="li_email">Эл-пошта</span><input type="email" id="rg-email" required placeholder="email@me.kz" /></label>
        <label><span data-i18n="rg_pass">Пароль (кемінде 6 таңба)</span>
          <div class="pass-wrap">
            <input type="password" id="rg-pass" required minlength="6" placeholder="••••••" />
            <button type="button" class="pass-toggle" data-target="rg-pass" aria-label="Парольді көрсету/жасыру" data-i18n-title="pass_toggle" title="Көрсету / жасыру">👁️</button>
          </div>
        </label>
        <label><span data-i18n="rg_role">Сіз кімсіз?</span>
          <select id="rg-role">
            <option value="teacher" data-i18n="rg_teacher">👩‍🏫 Мұғалім</option>
            <option value="student" data-i18n="rg_student">🎒 Оқушы</option>
          </select>
        </label>
        <label id="rg-subject-l"><span data-i18n="rg_subject">Пәніңіз</span><input type="text" id="rg-subject" data-i18n-ph="rg_subject_ph" placeholder="Мыс: Математика" /></label>
        <label id="rg-class-l" style="display:none"><span data-i18n="rg_class">Сыныбыңыз</span><input type="text" id="rg-class" data-i18n-ph="rg_class_ph" placeholder="Мыс: 9А" maxlength="5" /></label>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_title_reg">Тіркелу</button>
      </form>

      <div class="auth-msg" id="auth-msg"></div>
      <a href="index.html" class="auth-guest" data-i18n="auth_guest">Қонақ ретінде қарау →</a>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    const msg = (text, ok = true) => {
      const el = $("#auth-msg");
      el.textContent = text;
      el.className = "auth-msg " + (ok ? "ok" : "err");
    };

    /* Парольдің көзі: көрсету / жасыру */
    $$(".pass-toggle").forEach((b) =>
      b.addEventListener("click", () => {
        const inp = $("#" + b.dataset.target);
        const show = inp.type === "password";
        inp.type = show ? "text" : "password";
        b.textContent = show ? "🙈" : "👁️";
        b.classList.toggle("on", show);
      })
    );

    /* Пароль ұмытылды */
    function showReset(show) {
      $("#reset-form").style.display = show ? "" : "none";
      $("#login-form").style.display = show ? "none" : "";
      if (show) $("#rs-email").focus();
    }
    $("#forgot-toggle").addEventListener("click", () => showReset(true));
    $("#reset-back").addEventListener("click", () => showReset(false));
    $("#reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await resetPassword($("#rs-email").value);
        msg(t("reset_sent"));
        showReset(false);
      } catch (err) {
        msg(err.message, false);
      }
    });

    /* Табдар */
    $$(".auth-tab").forEach((tab) =>
      tab.addEventListener("click", () => {
        $$(".auth-tab").forEach((x) => x.classList.toggle("active", x === tab));
        $("#login-form").style.display = tab.dataset.tab === "login" ? "" : "none";
        $("#reg-form").style.display = tab.dataset.tab === "reg" ? "" : "none";
        $("#auth-title").textContent = tab.dataset.tab === "login" ? t("auth_title") : t("auth_title_reg");
        $("#auth-msg").textContent = "";
      })
    );

    /* Рөл таңдауы бойынша қосымша өрістер */
    $("#rg-role").addEventListener("change", (e) => {
      const teacher = e.target.value === "teacher";
      $("#rg-subject-l").style.display = teacher ? "" : "none";
      $("#rg-class-l").style.display = teacher ? "none" : "";
    });

    /* Кіру */
    $("#login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const u = await loginUser($("#li-email").value, $("#li-pass").value);
        msg(t("hello", u.name));
        setTimeout(() => afterAuthRedirect(u), 600);
      } catch (err) {
        msg(err.message, false);
      }
    });

    /* Тіркелу */
    $("#reg-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const u = await registerUser({
          name: $("#rg-name").value,
          email: $("#rg-email").value,
          pw: $("#rg-pass").value,
          role: $("#rg-role").value,
          subject: $("#rg-subject").value,
          className: $("#rg-class").value,
        });
        msg(t("registered", u.name));
        setTimeout(() => afterAuthRedirect(u), 600);
      } catch (err) {
        msg(err.message, false);
      }
    });

    /* Google */
    $("#google-btn").addEventListener("click", async () => {
      try {
        msg(t("google_connecting"));
        /* "Тіркелу" табы ашық болса — сол жердегі рөлі, әйтпесе сұрайды */
        const onReg = $("#reg-form").style.display !== "none";
        const u = await googleLogin(onReg ? $("#rg-role").value : null);
        if (u) {
          msg(t("hello", u.name));
          setTimeout(() => afterAuthRedirect(u), 600);
        }
      } catch (err) {
        msg(t("google_err") + " " + (err.message || err), false);
      }
    });

    /* Шығу сұранысы */
    if (new URLSearchParams(location.search).get("out")) {
      logout();
      location.replace("index.html");
    }

    /* Алдын ала кірген жағдай */
    const s = getSession();
    if (s) {
      $("#auth-title").textContent = t("hello", s.name);
      $("#auth-sub").textContent = s.role === "teacher" ? t("auth_as_teacher") : t("auth_as_student");
      $("#login-form").style.display = "none";
      $("#reg-form").style.display = "none";
      $("#google-btn").style.display = "none";
      $$(".auth-tab").forEach((tab) => (tab.style.display = "none"));
      const div = $(".auth-divider");
      if (div) div.style.display = "none";
      msg(t("auth_switch_note"));
      $("#google-btn").insertAdjacentHTML("afterend", `<button class="btn btn-ghost btn-block" id="do-logout" style="margin-top:10px">${t("menu_logout")}</button>`);
      $("#do-logout").addEventListener("click", () => {
        logout();
        location.replace("auth.html");
      });
    } else {
      $("#auth-title").textContent = t("auth_title");
      $("#auth-sub").textContent = t("auth_sub");
    }

    /* Тіл ауықса — таңба/қолдау мәтіндерін жаңарту */
    window.addEventListener("langchange", () => {
      const sess = getSession();
      if (sess) {
        $("#auth-title").textContent = t("hello", sess.name);
        $("#auth-sub").textContent = sess.role === "teacher" ? t("auth_as_teacher") : t("auth_as_student");
      } else {
        const onReg = $("#reg-form").style.display !== "none";
        $("#auth-title").textContent = onReg ? t("auth_title_reg") : t("auth_title");
        $("#auth-sub").textContent = t("auth_sub");
      }
    });
  </script>
</body>
</html>
