<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title_cabinet">Мұғалім кабинеті — Білім</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">🎓</span>
        <span class="logo-text">Білім<span class="logo-accent">мектеп</span></span>
      </a>
      <nav class="nav" id="nav">
        <a href="index.html" data-i18n="nav_home">Басты бет</a>
        <a href="cabinet.html" class="nav-cta" data-i18n="nav_cabinet">Кабинет</a>
        <a href="slides.html" data-i18n="nav_slides">Сабақ слайдтары</a>
      </nav>
      <button class="burger" id="burger" aria-label="Мәзір"><span></span><span></span><span></span></button>
    </div>
  </header>

  <!-- Жаңа баннер -->
  <section class="cab-hero">
    <div class="container cab-hero-inner">
      <div class="cab-hero-id">
        <div class="cab-avatar-big" id="cab-avatar"></div>
        <div class="cab-hero-info">
          <div class="cab-hero-kicker" data-i18n="cab_kicker">Мұғалім кабинеті</div>
          <h1 id="cab-name"></h1>
          <div class="cab-badges">
            <span class="cab-badge" id="cab-subject"></span>
            <span class="cab-badge" id="cab-exp"></span>
          </div>
        </div>
      </div>
      <div class="cab-hero-controls">
        <label><span data-i18n="cab_teacher">Мұғалім</span>
          <select id="teacher-select"></select>
        </label>
        <label><span data-i18n="cab_year">Оқу жылы</span>
          <select id="year-select"></select>
        </label>
      </div>
    </div>
    <div class="container cab-hero-stats">
      <a class="hstat hstat-link" href="schedule.html"><b id="stat-lessons">–</b><span data-i18n="stat_lessons">аптасына сабақ</span></a>
      <a class="hstat hstat-link" href="schedule.html"><b id="stat-classes">–</b><span data-i18n="stat_sched_classes">расписаниедегі сынып</span></a>
      <a class="hstat hstat-link" href="certificates.html"><b id="stat-certs">–</b><span data-i18n="stat_certs">сертификат</span></a>
      <a class="hstat hstat-link" href="achievements.html"><b id="stat-ach">–</b><span data-i18n="stat_ach">жетістік</span></a>
    </div>
  </section>


  <footer class="footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> Білім мектебі. <span data-i18n="footer_rights">Барлық құқықтар қорғалған.</span></span>
      <span class="muted" data-i18n="footer_cab">Мұғалім жұмысын жеңілдету — басты мақсат 🤝</span>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script src="i18n.js"></script>
  <script src="cabinet.js"></script>
</body>
</html>
